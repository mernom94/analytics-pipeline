[pytest]
asyncio_mode = auto
# session scope ensures the event loop lives for the entire test run,
# which is required by the session-scoped engine and session_factory fixtures.
# The loop is torn down AFTER engine.dispose() completes — eliminating the
# "Event loop is closed" error from function-scoped engine disposal.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = WARNING