services:
  - type: web
    name: analytics-pipeline
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && chmod +x start.sh
    startCommand: ./start.sh
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: portfolio-redis
          property: connectionString
      - key: WORKER_ID
        value: analytics-api-1
